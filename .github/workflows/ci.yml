name: CI Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  lint-build-test:
    name: Lint, Build, and Test Monorepo
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting across all packages
        run: npm run lint

      - name: Build shared package and all apps
        run: npm run build

      - name: Run test suites across all packages and apps
        run: npm run test
        env:
          SUPABASE_JWT_SECRET: test-secret-key-1234567890-very-secure
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-service-role-key
